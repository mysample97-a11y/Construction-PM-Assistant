<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIM Multi-Site Delivery Tracker</title>
<meta name="description" content="Track BIM production across multiple sites from your own spreadsheet. Runs entirely in your browser; site and resource codes only.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#12212F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2312212F'/%3E%3Cpath d='M6 22h6v4H6zM13 14h6v12h-6zM20 8h6v18h-6z' fill='%23E8A317'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/app.css">
<!-- SheetJS (Apache-2.0) is vendored, not loaded from a CDN, so the app makes no
     third-party request at all. Licence: assets/vendor/XLSX-LICENSE.txt -->
<script src="assets/vendor/xlsx.full.min.js"></script>
</head>
<body>
<noscript>
  <div style="padding:48px;max-width:60ch;margin:0 auto;font-family:system-ui,sans-serif">
    <h1>JavaScript is required</h1>
    <p>This tool reads your spreadsheet, calculates every figure and stores your work entirely inside the browser. None of that is possible with JavaScript disabled.</p>
  </div>
</noscript>
<div id="app"></div>
<script type="module" src="js/main.js"></script>
<script>
// ES modules do not load over file:// — the commonest cause of a blank page.
if (location.protocol === 'file:') {
  document.getElementById('app').innerHTML =
    '<div style="padding:48px;max-width:64ch;margin:0 auto;font-family:system-ui,sans-serif">' +
    '<h1>Open this over a web server, not from the file system</h1>' +
    '<p>Browsers block JavaScript modules loaded from <code>file://</code>, so double-clicking index.html shows a blank page.</p>' +
    '<p>From this folder run <code>python3 -m http.server 8000</code> and open <code>http://localhost:8000</code>. On GitHub Pages it works as-is.</p></div>';
}
</script>
</body>
</html>
